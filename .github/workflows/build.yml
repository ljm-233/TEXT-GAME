name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================
  # Linux (Arch 容器 - 最稳，SFML 3 官方有包)
  # ============================================================
  build-arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel cmake ninja sfml git \
            clang

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (with tests)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        run: ./build/tests/unit_tests

  # ============================================================
  # Sanitizer（ASan + UBSan + LSan）
  # 与上面的 build-arch 同构，只是多开 -DSANITIZE=ON。
  # 存在的意义：普通 Debug 构建看不出 use-after-free / 越界 / 未定义行为。
  # GameWorld::reset() 的悬垂指针就是这么藏了好几个月的 —— 四个平台全绿。
  # ============================================================
  test-asan:
    name: Sanitizer
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel cmake ninja sfml git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (with sanitizer)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DSANITIZE=ON

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        run: ./build/tests/unit_tests

  # ============================================================
  # clang-tidy（.clang-tidy 里 WarningsAsErrors: '*'，有 warning 就红）
  #
  # 只需要 configure、不需要 build：clang-tidy 要的是
  # compile_commands.json 里的编译参数。所以这个 job 很便宜。
  # ============================================================
  lint:
    name: clang-tidy
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel cmake ninja sfml git clang

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (only to get compile_commands.json)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        # tools/ 也要扫：冒烟工具本身就是守别的 bug 的代码（scene_smoke 一跑起来
        # 就抓到过 GameScene 的空 world_ 崩溃），它自己却一直不在门禁里。
        # 加之前先确认能过：run-clang-tidy -p build/release tools/ 零 user-code 警告。
        run: run-clang-tidy -p build -j "$(nproc)" src/ tools/

  # ============================================================
  # Ubuntu（从源码编译 SFML 3）
  # ============================================================
  build-ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git \
            libxrandr-dev libxcursor-dev libudev-dev \
            libopenal-dev libflac-dev libvorbis-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfreetype6-dev \
            libxi-dev libx11-dev

      # 缓存的必须是**装好的那棵树**（约 20MB），不是构建目录（几百 MB 对象文件）。
      # 这里曾经只 build 从不 install，于是 /tmp/SFML-install 永远不存在：
      #   - 未命中：每次 push 都白编译一遍 SFML（实测 ~33s）
      #   - Post 步骤：路径不存在 → 静默不存缓存，所以"缓存"从来就没存进去过
      #     （`gh api .../actions/caches` 是空的）
      #   - 万一真存上了：下面 "Install SFML" 的 cd /tmp/SFML/build 会因为
      #     该步被 skip 而不存在，直接失败
      # 三道一起修：build 完就 install 进前缀，再从缓存树复制到 /usr/local，
      # 于是命中与未命中走的是同一条安装路径。
      - name: Cache SFML install
        id: cache-sfml
        uses: actions/cache@v4
        with:
          path: /tmp/SFML-install
          key: sfml-3.0.0-ubuntu-24.04

      - name: Build & install SFML 3
        if: steps.cache-sfml.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 3.0.0 \
            https://github.com/SFML/SFML.git /tmp/SFML
          cmake -S /tmp/SFML -B /tmp/SFML/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/SFML-install \
            -DBUILD_SHARED_LIBS=ON \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_DOC=OFF
          cmake --build /tmp/SFML/build -j
          cmake --install /tmp/SFML/build --prefix /tmp/SFML-install

      - name: Install SFML
        run: |
          # SFML 导出的 cmake 配置与 target 文件都是可重定位的
          # （SFMLConfig.cmake 用 CMAKE_CURRENT_LIST_DIR，targets 文件用
          # ${_IMPORT_PREFIX}），所以整棵树换个前缀复制即可，不依赖 /tmp/SFML/build。
          sudo cp -a /tmp/SFML-install/. /usr/local/
          sudo ldconfig

      - name: Configure (with tests)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        run: ./build/tests/unit_tests

  # ============================================================
  # macOS（Homebrew SFML）
  # ============================================================
  build-macos:
    name: macOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja sfml

      - name: Configure (with tests)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        run: ./build/tests/unit_tests

  # ============================================================
  # Windows（vcpkg）
  # ============================================================
  build-windows:
    name: Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg integrate install

      - name: Install SFML via vcpkg
        run: |
          C:\vcpkg\vcpkg install sfml:x64-windows

      - name: Configure
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DBUILD_TESTS=ON `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        run: .\build\tests\unit_tests.exe
  # ============================================================
  # AUR 包：PKGBUILD 能不能真的构建出来
  #
  # PKGBUILD 是会腐烂的 —— 上游 tag 没了、依赖改名了、补丁失效了。
  # 这个 job 每次 push 都真跑一遍 makepkg，烂了立刻知道，
  # 而不是等某个用户来报「你的 AUR 包装不上」。
  # ============================================================
  aur:
    name: AUR package
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      # 装的是 PKGBUILD 里 depends + makedepends 的全集：
      #   depends      sfml
      #   makedepends  cmake ninja
      # base-devel 里没有 cmake / ninja（它们是独立包），少装一个
      # makepkg 就会以 "Missing dependencies" 退出（exit 8）。
      # 用户那边是 makepkg -si 自己装，CI 里得手动装上。
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel cmake ninja sfml git

      - uses: actions/checkout@v4

      # makepkg 拒绝以 root 运行（它的构建过程会往系统里装东西）。
      # 容器里默认是 root，所以建一个普通用户并把检出目录交给它。
      - name: Build the AUR package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'cd packaging/aur && makepkg -f --noconfirm'

      - name: Check the package contents
        run: |
          set -e
          pkg=$(ls packaging/aur/*.pkg.tar.zst | head -1)
          echo "产物: $pkg"

          rm -rf /tmp/aurpkg && mkdir -p /tmp/aurpkg
          bsdtar -xf "$pkg" -C /tmp/aurpkg

          # 安装布局：二进制与资源同级（Paths 靠这个判定打包模式）
          test -x /tmp/aurpkg/usr/lib/text-game/text_game
          test -f /tmp/aurpkg/usr/lib/text-game/assets/font.ttf
          test -x /tmp/aurpkg/usr/bin/text-game
          test -f /tmp/aurpkg/usr/share/applications/text-game.desktop

          # 依赖用系统的，不能自带 lib/
          if [ -d /tmp/aurpkg/usr/lib/text-game/lib ]; then
            echo "AUR 包不该带依赖库（应该依赖系统 sfml）"; exit 1
          fi

          # ⭐ 二进制里绝不能编进构建机的路径。makepkg 会报
          #    「软件包含有对 $srcdir 的引用」，0.3.5 之前所有发行包都踩过。
          if strings /tmp/aurpkg/usr/lib/text-game/text_game | grep -q "$PWD"; then
            echo "二进制里编进了构建路径："
            strings /tmp/aurpkg/usr/lib/text-game/text_game | grep "$PWD" | head -3
            exit 1
          fi
          echo "全部通过"
