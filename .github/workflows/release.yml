name: Release

on:
  push:
    tags:
      - 'v*'    # v0.1.0, v1.0.0 等
  workflow_dispatch:

jobs:
  release-linux:
    name: Linux
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel cmake ninja sfml git

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUNDLE_RUNTIME_DEPS=ON

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: |
          cd build
          cpack

      - name: Verify bundle is self-contained
        run: |
          cd build
          mkdir -p /tmp/verify
          tar xzf TEXT-GAME-*-Linux.tar.gz -C /tmp/verify
          test -x /tmp/verify/TEXT-GAME

          count=$(ls /tmp/verify/lib/*.so* 2>/dev/null | wc -l)
          echo "包内库数量: $count"
          [ "$count" -ge 5 ] || { echo "lib/ 几乎是空的，依赖没打进去"; exit 1; }

          # 启动器就是靠这个环境变量让直接 + 间接依赖都走包内的
          if LD_LIBRARY_PATH=/tmp/verify/lib ldd /tmp/verify/text_game | grep -q "not found"; then
            echo "有未解析的依赖："
            LD_LIBRARY_PATH=/tmp/verify/lib ldd /tmp/verify/text_game | grep "not found"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TEXT-GAME-Linux
          path: |
            build/*.tar.gz
            build/*.zip

  release-macos:
    name: macOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja sfml

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUNDLE_RUNTIME_DEPS=ON

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: |
          cd build
          cpack

      # macOS 的包一旦"看起来能打出来但其实起不来"，下载的人只会看到
      # 一句 SIGKILL / Library not loaded，很难查。所以这里把三件最容易
      # 悄悄坏掉的事钉成硬检查：
      #   1. 资源在可执行文件旁边 —— Paths 就是靠这个判定"打包模式"的，
      #      不在的话会退回开发模式，去用编译期的 PROJECT_ROOT
      #   2. Mach-O 的代码签名还有效（strip / install_name_tool 都会毁掉它，
      #      Apple Silicon 上内核随后直接 SIGKILL）
      #   3. 没有任何指向系统之外的绝对 install name 残留，且每个依赖
      #      都能在 Contents/Frameworks/ 里找到
      - name: Verify bundle is self-contained
        run: |
          cd build
          mkdir -p /tmp/verify
          tar xzf TEXT-GAME-*-macOS.tar.gz -C /tmp/verify

          APP=/tmp/verify/TEXT-GAME.app
          BIN="$APP/Contents/MacOS/text_game"
          FW="$APP/Contents/Frameworks"
          test -x "$BIN"

          echo "== 布局 =="
          test -f "$APP/Contents/MacOS/assets/font.ttf" \
            || { echo "assets 不在可执行文件旁边，Paths 会退回开发模式"; exit 1; }

          count=$(ls "$FW"/*.dylib 2>/dev/null | wc -l)
          echo "包内 dylib 数量: $count"
          [ "$count" -ge 5 ] || { echo "Frameworks 几乎是空的，依赖没打进去"; exit 1; }

          echo "== 代码签名 =="
          for f in "$BIN" "$FW"/*.dylib; do
            codesign --verify "$f" || { echo "签名失效: $f"; exit 1; }
          done

          echo "== 依赖是否都在包内 =="
          for target in "$BIN" "$FW"/*.dylib; do
            for dep in $(otool -L "$target" | tail -n +2 | awk '{print $1}'); do
              case "$dep" in
                /usr/lib/*|/System/*) continue ;;
                /*) echo "残留绝对依赖: $target -> $dep"; exit 1 ;;
              esac
              base=$(basename "$dep")
              [ -f "$FW/$base" ] || { echo "依赖不在包内: $target -> $dep"; exit 1; }
            done
          done
          echo "全部通过"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TEXT-GAME-macOS
          path: build/*.tar.gz

  create-release:
    name: Create Release
    needs: [release-linux, release-macos]
    runs-on: ubuntu-latest

    # workflow_dispatch 只拿来当"打包演练"用：跑完能拿到 artifacts，
    # 但不会去创建 release（手动触发时 github.ref 是分支，不是 tag）。
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}