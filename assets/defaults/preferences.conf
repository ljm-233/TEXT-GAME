# 随发行包发布的默认设置。
#
# 首次运行时由 config/bootstrap.cpp 铺到用户配置目录（~/.config/text-game/），
# 之后完全归用户所有——文件已存在就绝不覆盖。
#
# 为什么需要这个文件：打包模式下 Config 读的是 ~/.config/text-game/，
# 包里的东西它不会看。想让发行版带上"预设设置"，只能在首次运行时落一次盘。
#
# 这里只放**观感类**设置。以下内容刻意不放，否则每个新用户都会继承开发机的状态：
#   player_name          个人名字
#   resolution_index     机器分辨率
#   window_mode / fullscreen
#   ui_scale / font_scale  按开发机屏幕尺寸调的
#   current_wallpaper    个人壁纸口味
#   remember_window_size 与 runtime.conf 联动
#   key_*                个人键位
#
# ⚠️ 下面这三个是**跟显卡与显示器绑定**的性能设置，不是观感设置，同样不能放：
#   vsync / fps_limit / anti_aliasing
#   0.3.1~0.3.3 的发行版把开发机的 vsync=false + fps_limit=0 + anti_aliasing=0
#   原样发了出去 —— 而 fps_limit=0 在 SFML 里就是「不限帧」，于是每个新用户
#   默认都是不锁帧、不开垂直同步、不开抗锯齿，显卡满载空转。
#   删掉这三个键之后，走 src/core/bootstrap.cpp 与 display_tab.cpp 里的兜底值
#   （vsync=true / fps_limit=60 / anti_aliasing=8），一处定义、不再两边打架。
#   玩家想调自己去设置里调，调完就写进他自己的配置，从此归他所有。
#
# 想改发行版的默认观感，直接改这个文件即可。

parallax=true
notification_enabled=true
console_panel_alpha=210
language=zh
log_level=2
pseudo_3d=true
sound_volume=0.804167
console_prompt=1
initial_lives=1
theme=1
gamepad_enabled=true
console_blink_cursor=true
bgm_enabled=false
animation_speed_index=1
notification_position=2
console_font_size=14
show_fps=true
button_outline=2.000000
clock_position=0
log_rotate=1
console_mask=131
screen_shake=true
show_clock=false
console_line_height=26
particles=true
sound_enabled=true
button_corner=6.000000
log_keep=0
animation_enabled=false
auto_pause_on_blur=true
upscale_mode=0
player_animation=true
render_scale=1.000000
bgm_volume=0.000000
fps_position=1
level_intro=true
fps_format=2

# 后处理（默认全关，玩家可在 设置 → 画面 里开）
post_saturation=1.000000
post_contrast=1.000000
post_brightness=1.000000
post_gamma=1.000000
post_vignette=0.000000
post_bloom_strength=0.000000
post_bloom_threshold=0.700000
post_chromatic=0.000000
post_grain=0.000000
post_scanline=0.000000
post_dither=0.000000
